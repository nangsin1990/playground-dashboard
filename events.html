<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav class="topnav">
  <div class="brand"><div class="brand-icon">🛝</div><div class="brand-text">Playground</div></div>
  <div class="nav-links">
    <a class="nav-link" href="/">📊 Overview</a>
    <a class="nav-link" href="/global.html">🌐 Global</a>
    <a class="nav-link" href="/etf.html">📦 ETF</a>
    <a class="nav-link" href="/leaders.html">🏆 Leadership</a>
    <a class="nav-link" href="/laggards.html">📉 Laggards</a>
    <a class="nav-link" href="/thematic.html">🧩 Thematic</a>
    <a class="nav-link" href="/rotation.html">🔄 Rotation</a>
    <a class="nav-link" href="/screener.html">🔍 Screener</a>
    <a class="nav-link" href="/correlation.html">📈 Correlations</a>
    <a class="nav-link" href="/calendar.html">📅 Calendar</a>

    <a class="nav-link active" href="/events.html">⚡ Events</a>
    <a class="nav-link" href="/stock.html">🔬 Stock</a>
  </div>
</nav>
<div class="page">
  <div class="page-header">
    <div class="page-title">⚡ Economic Event Impact</div>
    <div class="page-sub">ผลกระทบวันประกาศต่อ QQQ / SPY / Gold / BTC / น้ำมัน / ค่าเงิน จากราคาวัน 2 ปีย้อนหลัง</div>
  </div>
  <div class="data-lag-banner" id="note">กำลังโหลด...</div>
  <div id="cards"></div>
</div>
<script src="/nav.js"></script>
<script>
function bar(v){
  const pct=Math.min(100, Math.abs(v)*40);
  const col=v>=0?'#10b981':'#ef4444';
  const side=v>=0?'left:50%':'right:50%';
  return `<div style="position:relative;height:10px;background:#e2e8f0;border-radius:6px;margin:6px 0 2px">
    <div style="position:absolute;top:0;bottom:0;width:1px;left:50%;background:#94a3b8"></div>
    <div style="position:absolute;top:0;height:100%;width:${pct}%;${side};background:${col};border-radius:6px"></div>
  </div>`;
}
fetch('/api/event_impact').then(r=>r.json()).then(d=>{
  document.getElementById('note').textContent = d.disclaimer || d.error || '';
  if(!d.ok){ document.getElementById('cards').textContent=d.error||'error'; return; }
  document.getElementById('cards').innerHTML = (d.cards||[]).map(c=>`
    <div class="panel" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div>
          <div style="font-weight:800">${c.name} <span class="badge-muted">${c.code}</span></div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">${c.next_date||'—'} · ${c.days_away==null?'':('อีก '+c.days_away+' วัน')} · n=${c.sample}${c.approx?' · วันโดยประมาณ':''}</div>${c.skip_reason?`<div style="font-size:12px;color:#b45309;margin-top:6px">${c.skip_reason}</div>`:''}
        </div>
      </div>
      <div style="margin-top:12px;font-size:12px;font-weight:700">ค่าเฉลี่ยวันประกาศ (มีเครื่องหมาย)</div>
      ${(c.assets||[]).map(a=>`
        <div style="margin-top:8px">
          <div style="display:flex;justify-content:space-between;font-size:13px"><b>${a.asset}</b><span style="color:${a.mean>=0?'#10b981':'#ef4444'}">${a.mean>=0?'+':''}${a.mean}% · n=${a.n}</span></div>
          ${bar(a.mean)}
        </div>`).join('')}
      <div style="margin-top:14px;font-size:12px;font-weight:700">วันข่าวนีราคาวิ่งแรงกว่าปกติกี่เท่า</div>
      <table style="width:100%;margin-top:6px;font-size:12px">
        <thead><tr><th>สินทรัพย์</th><th>แรงกว่าปกติ</th><th>เฉลี่ย</th><th>ค่ากลาง</th><th>แรงสุด</th><th>วันปกติ</th><th>N</th></tr></thead>
        <tbody>${(c.vol||[]).map(v=>`<tr>
          <td>${v.asset}</td><td><b>×${v.mult??'—'}</b></td><td>${v.mean}%</td><td>${v.median}%</td><td>${v.max}%</td><td>${v.normal}%</td><td>${v.n}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`).join('');
}).catch(e=>{document.getElementById('note').textContent=e.message;});
</script>
</body>
</html>
