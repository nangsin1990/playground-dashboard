<style>
:root{--panel-bg:#ffffff;--border:#e2e8f0;--indigo:#6366f1;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--muted:#64748b;--muted2:#64748b;--text:#0f172a;}

.search-bar{display:flex;gap:10px;margin-bottom:20px;}
.ticker-input{flex:1;background:#ffffff;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 16px;font-size:16px;font-weight:700;text-transform:uppercase;}
.ticker-input:focus{outline:none;border-color:var(--indigo);}
.btn-load{background:var(--indigo);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-load:hover{opacity:.85;}

.tab-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px;}
.tab-btn{padding:7px 16px;border-radius:6px;border:none;background:transparent;color:var(--muted2);font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{background:#6366f120;color:#4338ca;}

.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:16px;}
.metric-card{background:#ffffff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.metric-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:2px;}
.metric-value{font-size:18px;font-weight:800;color:var(--text);}
.metric-sub{font-size:10px;margin-top:2px;}
.up{color:#34d399;}.dn{color:#f87171;}.neu{color:var(--muted2);}

.signal-chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;margin:2px;}
.chip-bull{background:rgba(16,185,129,.15);color:#34d399;}
.chip-bear{background:rgba(239,68,68,.12);color:#f87171;}
.chip-neu {background:rgba(100,116,139,.12);color:#64748b;}

.chart-wrap{height:180px;position:relative;overflow:hidden;}
.spark-canvas{width:100%;height:100%;}

.vp-bar{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.vp-label{width:55px;text-align:right;font-size:10px;color:var(--muted);font-weight:600;}
.vp-track{flex:1;height:10px;background:#e2e8f0;border-radius:3px;overflow:hidden;}
.vp-fill{height:100%;border-radius:3px;background:var(--indigo);transition:width .4s;}
.vp-poc .vp-fill{background:var(--orange);}
.vp-pct{font-size:10px;color:var(--muted);width:34px;}

.earn-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e2e8f0;font-size:12px;}
.earn-date{color:var(--muted);width:85px;flex-shrink:0;}
.earn-badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;}
.earn-beat{background:rgba(16,185,129,.15);color:#34d399;}
.earn-miss{background:rgba(239,68,68,.12);color:#f87171;}

.div-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0;font-size:12px;}

.iv-table td,.iv-table th{padding:6px 12px;font-size:12px;}
.iv-table th{color:var(--muted);font-size:10px;font-weight:700;}

.data-lag-banner{background:#e2e8f0;border-left:3px solid var(--orange);padding:6px 14px;border-radius:4px;font-size:11px;color:var(--muted2);margin-bottom:14px;}

.rs-chart-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.rs-chart-wrap{grid-template-columns:1fr;}}

#emptyState{text-align:center;padding:60px;color:var(--muted);font-size:14px;}

.check-card{border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px;background:#fff}
.check-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.check-k{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.check-h{font-size:26px;font-weight:800;line-height:1.15;margin-top:4px}
.check-sum{font-size:13px;color:var(--muted2);margin-top:6px;max-width:640px}
.check-ok{color:#059669}.check-wait{color:#d97706}.check-bad{color:#dc2626}.check-info{color:#4f46e5}
.check-scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:14px}
.check-score{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px}
.check-score b{display:block;font-size:20px;margin-top:2px}
.check-gates{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.check-gate{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:#f1f5f9;color:#475569}
.check-gate.on{background:#ecfdf5;color:#047857}
.check-gate.warn{background:#fef2f2;color:#b91c1c}
.check-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:700px){.check-cols{grid-template-columns:1fr}}
.check-cols ul{margin:6px 0 0;padding-left:18px;color:var(--muted2);font-size:12px}
</style>
</head>

<div class="container">
  <div class="page-header">
    <h1>🔬 Stock Deep Dive</h1>
    <span class="updated-badge" id="updatedBadge">—</span>
  </div>

  <div class="data-lag-banner">⏱ yfinance data delayed ~15 min during market hours</div>

  <div class="search-bar">
    <input class="ticker-input" id="tickerInput" type="text" placeholder="AAPL, NVDA, PTT.BK …" maxlength="16">
    <button class="btn-load" type="button" onclick="loadStock()">ดูหุ้นนี้</button>
  </div>

  <div id="checkPanel" style="display:none"></div>

  <div class="tab-row" id="tabRow" style="display:none">
    <button class="tab-btn active" onclick="showTab('technical')">📐 Technical</button>
    <button class="tab-btn" onclick="showTab('pivots')">📍 Pivots</button>
    <button class="tab-btn" onclick="showTab('volume')">📊 Volume Profile</button>
    <button class="tab-btn" onclick="showTab('rs')">📈 RS vs Market</button>
    <button class="tab-btn" onclick="showTab('fundamentals')">🧮 Fundamentals</button>
    <button class="tab-btn" onclick="showTab('earnings')">💰 Earnings</button>
    <button class="tab-btn" onclick="showTab('dividends')">🏦 Dividends</button>
    <button class="tab-btn" onclick="showTab('options')">🎯 Options IV</button>
  </div>

  <div id="emptyState">Enter a ticker above and click Analyse</div>
  <div id="loadingState" style="display:none;text-align:center;padding:40px;color:var(--muted)">Loading…</div>

  <!-- TABS -->
  <div id="tabTechnical" class="tab-panel" style="display:none"></div>
  <div id="tabPivots"    class="tab-panel" style="display:none"></div>
  <div id="tabVolume"    class="tab-panel" style="display:none"></div>
  <div id="tabRs"        class="tab-panel" style="display:none"></div>
  <div id="tabFundamentals" class="tab-panel" style="display:none"></div>
  <div id="tabEarnings"  class="tab-panel" style="display:none"></div>
  <div id="tabDividends" class="tab-panel" style="display:none"></div>
  <div id="tabOptions"   class="tab-panel" style="display:none"></div>

<script src="/nav.js"></script>
<script>
let _state = {ticker:"", theme:"", data:{}};
let _drawRsChart = null;

function $(id){ return document.getElementById(id); }
function pct(v, d=1){ return v==null?"—":`<span class="${v>0?"up":v<0?"dn":"neu"}">${v>0?"+":""}${v.toFixed(d)}%</span>`; }
function val(v, d=2){
  if(Array.isArray(v)) v=v[0];
  if(v==null||v===""||!isFinite(Number(v))) return "—";
  return Number(v).toFixed(d);
}
function chip(signal){
  signal = (signal==null||signal==="") ? "—" : String(signal);
  const c = signal.includes("Bull")||signal.includes("Above")||signal.includes("Upper")?"chip-bull":
            signal.includes("Bear")||signal.includes("Below")||signal.includes("Over")&&!signal.includes("Above")?"chip-bear":
            signal.includes("Overbought")?"chip-bear":
            signal.includes("Oversold")?"chip-bull":"chip-neu";
  return `<span class="signal-chip ${c}">${signal}</span>`;
}

async function loadStock(){
  const tk = $("tickerInput").value.trim().toUpperCase();
  if(!tk){ return; }
  _state.ticker = tk;
  $("emptyState").style.display = "none";
  $("tabRow").style.display = "none";
  $("loadingState").style.display = "";
  $("loadingState").textContent = "Loading " + tk + " …";
  ["tabTechnical","tabPivots","tabVolume","tabRs","tabFundamentals","tabEarnings","tabDividends","tabOptions"]
    .forEach(id => $(id).style.display = "none");

  const box = $("checkPanel");
  box.style.display = "";
  box.innerHTML = `<div class="check-card"><div class="check-k">Stock check</div><div class="check-sum">Scoring ${tk}…</div></div>`;
  const [tech, rs, fund, earn, div, iv] = await Promise.all([
    fetch(`/api/technicals?ticker=${encodeURIComponent(tk)}`).then(r=>r.json()).catch(e=>({ok:false,error:String(e)})),
    fetch(`/api/sector_rs?ticker=${encodeURIComponent(tk)}&theme=${encodeURIComponent(_state.theme||"")}`).then(r=>r.json()).catch(()=>({ok:false})),
    fetch(`/api/fundamentals?ticker=${encodeURIComponent(tk)}`).then(r=>r.json()).catch(()=>({ok:false})),
    fetch(`/api/earnings?ticker=${encodeURIComponent(tk)}`).then(r=>r.json()).catch(()=>({ok:false})),
    fetch(`/api/dividends?ticker=${encodeURIComponent(tk)}`).then(r=>r.json()).catch(()=>({ok:false})),
    fetch(`/api/options_iv?ticker=${encodeURIComponent(tk)}`).then(r=>r.json()).catch(()=>({ok:false})),
  ]);

  _state.data = {tech, rs, fund, earn, div, iv};
  $("loadingState").style.display = "none";
  loadStockCheck(tk);
  if(!tech || !tech.ok){
    $("emptyState").style.display = "";
    $("emptyState").textContent = "โหลดกราฟ " + tk + " ไม่สำเร็จ: " + ((tech && tech.error) || "ไม่มีข้อมูลจาก Yahoo");
    return;
  }
  $("tabRow").style.display = "";
  $("updatedBadge").textContent = tech.updated || "—";

  renderTechnical(tech);
  renderPivots(tech);
  renderVolume(tech);
  renderRS(rs);
  renderFundamentals(fund);
  renderEarnings(earn);
  renderDividends(div);
  renderOptions(iv);
  showTab("technical");
}
document.getElementById("tickerInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); loadStock(); }
});

function loadStockCheck(tk){
  const box = $("checkPanel");
  box.style.display = "";
  box.innerHTML = `<div class="check-card"><div class="check-k">Stock check</div><div class="check-sum">Scoring ${tk}…</div></div>`;
  fetch(`/api/stock_check?ticker=${encodeURIComponent(tk)}`)
    .then(r => r.json())
    .then(d => renderStockCheck(d, tk))
    .catch(e => renderStockCheck({ok:false,error:String(e)}, tk));
}

function scoreVal(v){
  if(v==null) return "—";
  if(typeof v==="object") return (v.score!=null?v.score:"—");
  return v;
}
function renderStockCheck(d, tk){
  const box = $("checkPanel");
  if(!d || !d.ok){
    const why = (d && (d.error || d.detail || d.summary)) || "incomplete data";
    box.innerHTML = `<div class="check-card"><div class="check-k">Stock check</div>
      <div class="check-h check-info">${(d && d.headline) || "Insufficient data"}</div>
      <div class="check-sum">${why} — use the tabs below</div></div>`;
    return;
  }
  const tone = d.tone || "info";
  const scores = d.scores || {};
  const labels = d.labels || {};
  const sit = [labels["Quality"], labels["Price"], labels["Trend"]].filter(Boolean).join(" · ");
  const scoreHtml = Object.entries(scores).map(([k,v]) =>
    `<div class="check-score"><div class="check-k">${k}</div><b>${scoreVal(v)}</b></div>`
  ).join("");
  const gates = (d.gates||[]).map(g =>
    `<span class="check-gate ${g.warn?"warn":(g.on?"on":"")}">${g.label}${g.on?" ✓":""}</span>`
  ).join("");
  const use = (d.use||[]).map(x=>`<li>${x}</li>`).join("") || "<li>—</li>";
  const ignore = (d.ignore||[]).map(x=>`<li>${x}</li>`).join("") || "<li>—</li>";
  const lv = d.levels || {};
  const px = d.price || {};
  box.innerHTML = `<div class="check-card">
    <div class="check-top">
      <div>
        <div class="check-k">Stock check · ${d.ticker||tk}${d.name?" · "+d.name:""}</div>
        <div class="check-h check-${tone}">${d.headline||"—"}</div>
        <div class="check-sum">${sit || d.summary || ""}</div>
        ${sit && d.summary?`<div class="check-sum">${d.summary}</div>`:""}
      </div>
      <div style="font-size:12px;color:var(--muted);text-align:right">
        ${px.last!=null?"Ref "+px.last:""}<br>
        ${px.rsi!=null?"RSI "+px.rsi:""}${lv.stop!=null?" · stop "+lv.stop:""}<br>
        ${d.as_of?"as of "+d.as_of:""}
      </div>
    </div>
    <div class="check-scores">${scoreHtml}</div>
    <div class="check-gates">${gates}</div>
    <div class="check-cols">
      <div><div class="check-k">Use</div><ul>${use}</ul></div>
      <div><div class="check-k">Don't use</div><ul>${ignore}</ul></div>
    </div>
    <div class="check-sum" style="margin-top:10px">${d.note||""}</div>
  </div>`;
}

function showTab(name){
  document.querySelectorAll(".tab-btn").forEach((b,i)=>{
    const names=["technical","pivots","volume","rs","fundamentals","earnings","dividends","options"];
    b.classList.toggle("active", names[i]===name);
  });
  document.querySelectorAll(".tab-panel").forEach(p=>p.style.display="none");
  $("tab"+name.charAt(0).toUpperCase()+name.slice(1)).style.display="";
  requestAnimationFrame(()=>{
    if(name==="rs" && typeof _drawRsChart==="function") _drawRsChart();
    if(name==="technical" && _state.data && _state.data.tech){
      const d=_state.data.tech;
      drawLineChart("rsiCanvas", d.rsi_spark||[], "#6366f1", 0, 100, [{y:70,color:"#ef444460"},{y:30,color:"#10b98160"}]);
      drawBarChart("macdCanvas", d.macd_spark||[], d.macd_spark||[]);
      drawBBChart("bbCanvas", d.price_history||{});
      drawCandleChart("candleCanvas", d.price_history||{});
    }
  });
}

// ── Technical ──────────────────────────────────────────────────────────────
function fmtPrice(v){
  if(v==null||!isFinite(v)) return "—";
  return Number(v)<1 ? Number(v).toFixed(4) : Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}

function renderTechnical(d){
  if(!d.ok){ $("tabTechnical").innerHTML=`<div class="panel" style="padding:20px;color:var(--red)">${d.error||"Error"}</div>`; return; }
  if(d.price==null && _state.data && _state.data.fund && _state.data.fund.last_close!=null){ d.price=_state.data.fund.last_close; }
  const chg = d.change_pct;
  const chgCls = chg==null?"neu":(chg>=0?"pos":"neg");
  const chgTxt = chg==null?"—":`${chg>=0?"+":""}${Number(chg).toFixed(2)}%`;
  $("tabTechnical").innerHTML = `
  <div class="panel" style="padding:16px 18px;margin-bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <div>
      <div style="font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em">${d.ticker||""}</div>
      <div style="font-size:32px;font-weight:800;line-height:1.1;margin-top:4px">${fmtPrice(d.price)}</div>
    </div>
    <div style="text-align:right">
      <div class="${chgCls}" style="font-size:22px;font-weight:800">${chgTxt}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">ปิดก่อนหน้า ${fmtPrice(d.prev_close)} · หน่วง ~15 นาที</div>
    </div>
  </div>
  ${fundStrip()}
  <div class="panel" style="padding:14px;margin-bottom:10px;">
    <div class="panel-header"><span class="panel-title">30-Day Candles</span></div>
    <canvas id="candleCanvas" height="180" style="width:100%;display:block;margin-top:8px;"></canvas>
  </div>
  <div class="metric-grid">
    ${metric("RSI (14)", val(d.rsi,1), chip(d.rsi_signal))}
    ${metric("MACD Hist", val(d.macd_hist,4), chip(d.macd_signal))}
    ${metric("Stoch %K", val(d.stoch_k,1), chip(d.stoch_signal))}
    ${metric("BB Position", val(d.bb_pct,1)==="—"?"—":val(d.bb_pct,1)+"%", chip(d.bb_signal||"—"))}
    ${metric("VWAP", val(d.vwap,2), chip(d.vwap_signal))}
    ${metric("ATR (14)", val(d.atr,2), `<span class="metric-sub neu">${d.atr_pct!=null?d.atr_pct+"%":""} of price</span>`)}
  </div>
  <div class="panel" style="padding:14px;">
    <div class="panel-header"><span class="panel-title">RSI (14) — last 30 bars</span></div>
    <canvas id="rsiCanvas" height="80" style="width:100%;display:block;margin-top:8px;"></canvas>
  </div>
  <div class="panel" style="padding:14px;margin-top:10px;">
    <div class="panel-header"><span class="panel-title">MACD Histogram</span></div>
    <canvas id="macdCanvas" height="80" style="width:100%;display:block;margin-top:8px;"></canvas>
  </div>
  <div class="panel" style="padding:14px;margin-top:10px;">
    <div class="panel-header"><span class="panel-title">Price vs Bollinger Bands + VWAP</span></div>
    <canvas id="bbCanvas" height="100" style="width:100%;display:block;margin-top:8px;"></canvas>
  </div>`;

  requestAnimationFrame(()=>{
    drawLineChart("rsiCanvas", d.rsi_spark||[], "#6366f1", 0, 100, [{y:70,color:"#ef444460"},{y:30,color:"#10b98160"}]);
    drawBarChart("macdCanvas", d.macd_spark||[], d.macd_spark||[]);
    drawBBChart("bbCanvas", d.price_history||{});
    drawCandleChart("candleCanvas", d.price_history||{});
  });
}

function drawCandleChart(id, ph){
  const c=$(id); if(!c||!ph||!ph.close||!ph.close.length) return;
  const ctx=c.getContext("2d");
  c.width=c.parentElement.clientWidth; c.height=200;
  const w=c.width,h=c.height,n=ph.close.length;
  const opens=ph.open||ph.close, highs=ph.high||ph.close, lows=ph.low||ph.close;
  const nums=[...opens,...highs,...lows,...ph.close].filter(v=>v!=null&&isFinite(v));
  if(!nums.length) return;
  const axis=22;
  const lo=Math.min(...nums), hi=Math.max(...nums), pad=(hi-lo)*0.06||1;
  const y=v=> (h-axis-6)-((v-(lo-pad))/((hi+pad)-(lo-pad)))*(h-axis-16);
  const slot=w/n, body=Math.max(3, slot*0.55);
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="#e2e8f0"; ctx.beginPath(); ctx.moveTo(0,h-axis); ctx.lineTo(w,h-axis); ctx.stroke();
  for(let i=0;i<n;i++){
    const o=opens[i], hh=highs[i], l=lows[i], cl=ph.close[i];
    if(o==null||cl==null) continue;
    const up=cl>=o;
    const x=i*slot+slot/2;
    ctx.strokeStyle=up?"#10b981":"#ef4444";
    ctx.beginPath(); ctx.moveTo(x,y(hh??Math.max(o,cl))); ctx.lineTo(x,y(l??Math.min(o,cl))); ctx.stroke();
    const top=y(Math.max(o,cl)), bot=y(Math.min(o,cl));
    ctx.fillStyle=up?"#10b981":"#ef4444";
    ctx.fillRect(x-body/2, top, body, Math.max(1, bot-top));
  }
  const dates=ph.dates||[];
  const ticks=[0, Math.floor((n-1)/2), n-1].filter((v,i,a)=>a.indexOf(v)===i);
  ctx.fillStyle="#64748b"; ctx.font="10px system-ui"; ctx.textBaseline="top";
  ticks.forEach(i=>{
    const label=(dates[i]||"").slice(5);
    if(!label) return;
    const x=i*slot+slot/2;
    ctx.textAlign=i===0?"left":(i===n-1?"right":"center");
    ctx.fillText(label, x, h-axis+6);
  });
}

function renderPivots(d){
  const pack=d.pivots||{};
  const tf=window._pivotTf||"weekly";
  const labels={h4:"4 ชั่วโมง จากแท่ง 4H ที่ปิดแล้ว", daily:"รายวัน จากแท่งวานนี้", weekly:"รายสัปดาห์ จากสัปดาห์ที่ปิดแล้ว (ค่าเริ่มต้น)", monthly:"รายเดือน จากเดือนที่ปิดแล้ว"};
  const block=pack[tf];

        <thead><tr><th style="text-align:left">ระดับ</th><th>Classic</th><th>Fibonacci</th></tr></thead>
        <tbody>${rows.map(lv=>{
          const kind=lv.startsWith("R")?"R":lv.startsWith("S")?"S":"P";

}

function metric(label, val, sub=""){
  return `<div class="metric-card"><div class="metric-label">${label}</div><div class="metric-value">${val}</div>${sub}</div>`;
}

function drawLineChart(id, data, color="#6366f1", yMin=null, yMax=null, refs=[]){
  const c = $(id); if(!c||!data.length) return;
  const nums=data.map(Number).filter(v=>isFinite(v));
  if(!nums.length) return;
  const ctx = c.getContext("2d");
  c.width = c.parentElement.clientWidth; c.height = 80;
  const w=c.width, h=c.height, n=data.length;
  const lo = yMin??Math.min(...nums), hi = yMax??Math.max(...nums);
  const scale = v => h - (v - lo) / (hi - lo + .0001) * h;
  ctx.clearRect(0,0,w,h);
  // Reference lines
  refs.forEach(r => {
    ctx.beginPath(); ctx.strokeStyle=r.color; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    const y=scale(r.y); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); ctx.setLineDash([]);
  });
  // Line
  ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=2;
  data.forEach((v,i)=>{ if(!isFinite(Number(v))) return; const x=i/(n-1)*w, y=scale(Number(v)); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();
}

function drawBarChart(id, data){
  const c=$(id); if(!c||!data.length) return;
  const ctx=c.getContext("2d");
  c.width=c.parentElement.clientWidth; c.height=80;
  const w=c.width, h=c.height, n=data.length;
  const lo=Math.min(0,...data), hi=Math.max(0,...data);
  const zero = h - (0-lo)/(hi-lo+.0001)*h;
  const bw = w/n-1;
  ctx.clearRect(0,0,w,h);
  data.forEach((v,i)=>{
    const x=i*(bw+1), yv=h-(v-lo)/(hi-lo+.0001)*h;
    ctx.fillStyle = v>=0?"#34d399":"#f87171";
    ctx.fillRect(x, Math.min(yv,zero), bw, Math.abs(yv-zero)||1);
  });
}

function drawBBChart(id, ph){
  const c=$(id); if(!c||!ph.close||!ph.close.length) return;
  const ctx=c.getContext("2d");
  c.width=c.parentElement.clientWidth; c.height=100;
  const w=c.width, h=c.height;
  const vals=[...ph.close,...ph.vwap,...ph.bb_up,...ph.bb_lo].filter(v=>v!=null);
  if(!vals.length) return;
  const lo=Math.min(...vals), hi=Math.max(...vals);
  const sc = v => v==null?null:h-(v-lo)/(hi-lo+.0001)*h;
  const n=ph.close.length;
  const drawLine = (arr, color, dashed=false) => {
    ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=dashed?1:1.5;
    if(dashed) ctx.setLineDash([3,3]);
    let first=true;
    arr.forEach((v,i)=>{ const y=sc(v); if(y==null) return; const x=i/(n-1)*w; first?ctx.moveTo(x,y):ctx.lineTo(x,y); first=false; });
    ctx.stroke(); ctx.setLineDash([]);
  };
  ctx.clearRect(0,0,w,h);
  drawLine(ph.bb_up, "#6366f140", true);
  drawLine(ph.bb_lo, "#6366f140", true);
  drawLine(ph.bb_mid,"#6366f170", true);
  drawLine(ph.vwap,  "#f59e0b",  false);
  drawLine(ph.close, "#0f172a",  false);
}

      <div class="vp-pct">${vp.volume_pct[i]}%</div>

}

      const w=c.width,h=c.height,n=ac.dates.length;
